# Trade Me Category Details performance test - default configuration.
#
# Resolution order for every setting:
#   1. JVM system property      mvn test -Dtrademe.threads=10
#   2. Environment variable     TRADEME_THREADS=10
#   3. This file
#   4. Built-in default 
#
# 0 (or blank) means "derive from the Category ID data set":
#   threads    -> half the number of Category IDs, rounded up   (NFR-01)
#   rampup     -> one VUser per second                          (NFR-02)
#   throughput -> one call per Category ID per minute           (NFR-03)
trademe.protocol=https
trademe.host=api.tmsandbox.co.nz
trademe.port=
trademe.threads=0
trademe.rampupSeconds=0
trademe.vusersPerSecond=1
trademe.steadyStateSeconds=60
trademe.throughputPerMinute=0
trademe.p90ThresholdMs=500

trademe.jmeterHome=
trademe.htmlReport=true

trademe.outputRoot=../results
trademe.runLabel=
